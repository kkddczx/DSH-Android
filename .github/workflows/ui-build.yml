name: Build DSH UI APK

# 在 fork 里云构建带界面动画的 APK（手机可完成，无需电脑、无需 Node 工具链）：
#   1) 源码钉在官方 v0.3.11 tag；
#   2) 直接用官方 APK 里的 engine.zip + 原生 .so，跳过引擎编译；
#   3) 只改界面（Stream.kt / MessageAnimations.kt）后 gradle 打 debug APK。

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pin source to v0.3.11, keep patched UI files
        run: |
          UI=app/src/main/java/io/github/jackwener/dsh/feature/conversation
          mkdir -p /tmp/ui
          cp "$UI/Stream.kt" "$UI/MessageAnimations.kt" /tmp/ui/
          git fetch --depth 1 https://github.com/jackwener/DSH-Android.git tag v0.3.11
          git reset --hard FETCH_HEAD
          cp /tmp/ui/Stream.kt "$UI/Stream.kt"
          cp /tmp/ui/MessageAnimations.kt "$UI/MessageAnimations.kt"

      - name: Reuse official engine + native libs (v0.3.11 APK)
        run: |
          curl -fsSL -o dsh-official.apk \
            https://github.com/jackwener/DSH-Android/releases/download/v0.3.11/DSH-Android-v0.3.11-arm64.apk
          mkdir -p toolchains/out/engine toolchains/out/jniLibs/arm64-v8a
          unzip -o -q dsh-official.apk 'assets/engine*' -d /tmp/eng
          cp /tmp/eng/assets/* toolchains/out/engine/
          unzip -o -q dsh-official.apk 'lib/arm64-v8a/*' -d /tmp/libs
          cp /tmp/libs/lib/arm64-v8a/*.so toolchains/out/jniLibs/arm64-v8a/
          (cd toolchains/out/engine && sha256sum -c engine.sha256)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Accept licenses and install platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.2" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace \
            -Pdsh.nativeOut="$GITHUB_WORKSPACE/toolchains/out/jniLibs" \
            -Pdsh.engineOut="$GITHUB_WORKSPACE/toolchains/out/engine"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-ui-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
